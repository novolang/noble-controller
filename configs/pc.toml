# The Controller's part of the profile configs/pc.toml of orbit/ble, for the tests of this package (tests/ and src/ run with
# `novo test --config configs/pc.toml`).  orbit/ble/configs/pc.toml holds the same [noble-controller] section; tests/orbit/test_ble_config_equals_limits.sh holds the two to each other.

[noble-controller]
ctl_cis = 4
ctl_cigs = 1
ctl_adv_sets = 4
ctl_per_sync = 1
ctl_past = true
ctl_pcl = true
ctl_subrate = true
ctl_featpages = true
ctl_ploss = true
ctl_peersca = true
ctl_connrate = true
ctl_framespace = true
ctl_pawr_adv = true
ctl_pawr_sync = true
ctl_pawr_data = 100
ctl_pawr_bufs = 4
# Channel Sounding is out of this profile.
ctl_cs = 0
ctl_cs_configs = 0
ctl_cs_steps = 0
ctl_cs_roles = 0
ctl_cs_mode3 = false
ctl_cs_rtt_seq = false
ctl_cs_ant = 0
ctl_cs_3c = false
ctl_cs_ipt = false
ctl_cs_test = false
