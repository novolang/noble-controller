# The Controller's part of the profile configs/ctl_iso.toml of orbit/ble, for the tests of this package (tests/ and src/ run with
# `novo test --config configs/ctl_iso.toml`).  orbit/ble/configs/ctl_iso.toml holds the same [noble-controller] section; tests/orbit/test_ble_config_equals_limits.sh holds the two to each other.

[noble-controller]
ctl_cis = 4
ctl_cigs = 1
ctl_bigs = 2
ctl_bis = 4
ctl_pcl = true
ctl_subrate = true
ctl_featpages = true
ctl_ploss = true
ctl_peersca = true
ctl_connrate = true
ctl_framespace = true
# Channel Sounding: the plumbing and the stub commands (ll_cs.nv), one connection, one configuration, both roles, one antenna.
ctl_cs = 1
ctl_cs_configs = 1
ctl_cs_steps = 32
ctl_cs_roles = 3
ctl_cs_mode3 = false
ctl_cs_rtt_seq = false
ctl_cs_ant = 1
ctl_cs_3c = false
ctl_cs_ipt = false
ctl_cs_test = true
