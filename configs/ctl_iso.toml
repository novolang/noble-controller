# The Controller's part of the profile configs/ctl_iso.toml of orbit/ble, for the tests of this package (tests/ and src/ run with
# `novo test --config configs/ctl_iso.toml`).  orbit/ble/configs/ctl_iso.toml holds the same [noble-controller] section; tests/orbit/test_ble_config_equals_limits.sh holds the two to each other.

[noble-controller]
ctl_cis = 4
ctl_cigs = 1
ctl_bigs = 2
ctl_bis = 4
ctl_pcl = true
ctl_subrate = true
ctl_featpages = true
ctl_ploss = true
ctl_peersca = true
ctl_connrate = true
ctl_framespace = true
# Channel Sounding (ll_cs.nv) is not part of the audio profile: a product that wants it sets `ctl_cs` and the keys that go
# with it (configs/ctl_cs.toml is the profile with it on).  Off, the image links none of it (owner decision 2026-11-07).
ctl_cs = 0
ctl_cs_configs = 0
ctl_cs_steps = 0
ctl_cs_roles = 0
ctl_cs_mode3 = false
ctl_cs_rtt_seq = false
ctl_cs_ant = 0
ctl_cs_3c = false
ctl_cs_ipt = false
ctl_cs_test = false
